[project]
name = "kbase-template"
version = "0.1.0"
description = "A personal knowledge base: collect free sources, tag them, build cited lenses, write brief emails"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "pyyaml>=6",
  "feedparser>=6",
  "requests>=2.32",
  "numpy>=1.26",
  "html2text>=2019.9",
  "trafilatura>=2.0",
  "markdown>=3.6",
  "mcp>=1.2,<2",
]

[tool.uv]
package = false
